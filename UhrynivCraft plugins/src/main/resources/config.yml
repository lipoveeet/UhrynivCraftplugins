# =====================================================
#                  UhrynivCraft config
# =====================================================

mysql:
  host: "localhost"
  port: 3306
  database: "uhrynivcraft"
  username: "root"
  password: "password"
  useSSL: false
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000

economy:
  currency-name: "Uhryniv Points"
  currency-symbol: "UP"
  # How often (in seconds) the in-memory balance cache is flushed to MySQL
  save-interval-seconds: 60
  starting-balance: 0.0

# =====================================================
# ANTI-FARM
# =====================================================
antifarm:
  # Hourly earning tiers. The reward multiplier applied depends on how much
  # UP the player has already earned within the rolling current hour.
  # Each entry: up-to (exclusive upper bound, -1 = infinite) : multiplier
  limits:
    - up-to: 500
      multiplier: 1.0
    - up-to: 1000
      multiplier: 0.5
    - up-to: 2000
      multiplier: 0.2
    - up-to: -1
      multiplier: 0.05

  mining-speed:
    # Max blocks broken per second before we start suspending rewards (autoclicker/macro detection)
    max-blocks-per-second: 8
    # If exceeded, reward multiplier for that break
    over-speed-multiplier: 0.0
    # If a player breaks the same block type this many times in a row without
    # breaking any other type, the multiplier starts decaying
    same-block-streak-threshold: 40
    # Multiplier decays by this amount per block past the threshold, down to the floor
    same-block-decay-per-block: 0.02
    same-block-multiplier-floor: 0.1

  placed-blocks:
    # Blocks placed by a player and later broken by them give 0 reward
    # (prevents cobblestone/sand/bamboo generator farms)
    enabled: true

  afk:
    # Player is considered AFK-farming if their position barely changes
    # for this many seconds while still generating rewardable actions
    still-seconds-threshold: 20
    # Max horizontal+vertical movement (blocks) still counted as "not moved"
    movement-tolerance: 0.35
    afk-multiplier: 0.0

  mobs:
    natural-multiplier: 1.0
    spawner-multiplier: 0.2
    spawn-egg-multiplier: 0.0
    other-multiplier: 0.0

