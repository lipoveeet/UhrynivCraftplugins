name: Build UhrynivCraft

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "UhrynivCraft plugins"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload built plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: UhrynivCraft-plugin
          path: "UhrynivCraft plugins/target/UhrynivCraft-*.jar"
